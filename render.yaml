services:
- type: web
  name: ai-weekly-newsletter
  runtime: python
  plan: free
  buildCommand: pip install -r requirements.txt
  startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout
    180 --access-logfile -
  healthCheckPath: /healthz
  envVars:
  - key: APP_ENV
    value: production
  - key: PYTHON_VERSION
    value: 3.12.8
  - key: FLASK_SECRET_KEY
    generateValue: true
  - key: DATABASE_URL
    fromDatabase:
      name: ai-weekly-newsletter-db
      property: connectionString
  - key: NEWSLETTER_DATA_DIR
    value: /tmp/newsletter-data
  - key: GOOGLE_CLIENT_ID
    sync: false
  - key: GOOGLE_CLIENT_SECRET
    sync: false
  - key: AUTHORIZED_USERS_JSON
    sync: false
  - key: GOOGLE_SERVICE_ACCOUNT_JSON
    sync: false
  - key: GOOGLE_SLIDES_TEMPLATE_ID
    sync: false
  - key: GOOGLE_DRIVE_FOLDER_ID
    sync: false
  - key: OPENAI_API_KEY
    sync: false
databases:
- name: ai-weekly-newsletter-db
  plan: free
  databaseName: newsletter
  user: newsletter_app
