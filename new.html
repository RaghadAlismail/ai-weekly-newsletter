{% extends 'base.html' %}{% block content %}<section class="hero"><p class="eyebrow">NEWS INTAKE</p><h1>New Arabic issue</h1><p>Ten links are required. Full article text is optional: use it if the site is inaccessible or paywalled.</p></section><form method="post" class="panel"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><div class="pair"><label>Issue number<input required type="number" min="1" name="number" value="259"></label><label>Publication date<input required type="date" name="date" value="{{date}}"></label></div><h2>News links</h2>{% for j in range(1,11) %}<div class="url-line"><b>{{'%02d'|format(j)}}</b><label>News URL<input required type="url" name="url_{{j}}" placeholder="https://publisher.com/news/..."></label><details><summary>Optional content</summary><textarea name="content_{{j}}" rows="4" placeholder="Paste complete original article if needed"></textarea></details></div>{% endfor %}<button class="primary">Create issue · 10 articles</button></form>{% endblock %}
